server:
  port: ${SERVER_PORT:8082}

spring:
  application:
    name: periferiait-logic-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:teli_dev}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:post1842}
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        default_schema: social

security:
  jwt:
    # IDÉNTICO al de auth-service para validar el mismo HS256.
    secret: ${JWT_SECRET:dev-secret-please-change-this-is-a-long-hs256-key-0123456789abcdef}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost:8000}

# Swagger UI accesible en /docs (springdoc genera el spec desde los controllers)
springdoc:
  swagger-ui:
    path: /docs

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

logging:
  level:
    com.fjuanias.periferiait: INFO
