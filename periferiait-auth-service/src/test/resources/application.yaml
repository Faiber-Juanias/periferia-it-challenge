# Configuración SOLO para tests. Fija el dialect explícito para que el contexto
# (contextLoads) arranque sin necesitar una BD Postgres real corriendo.
spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/periferia
    username: postgres
    password: postgres
  jpa:
    hibernate:
      ddl-auto: none
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    properties:
      hibernate:
        boot:
          allow_jdbc_metadata_access: false

security:
  jwt:
    secret: test-secret-please-change-this-is-a-long-hs256-key-0123456789abcdef
    expiration-seconds: 3600
    issuer: periferiait-auth
