server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: periferiait-auth-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:teli_dev}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:post1842}
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        default_schema: auth

security:
  jwt:
    # Debe ser IDENTICO al de logic-service (misma secret para firmar/validar HS256).
    secret: ${JWT_SECRET:dev-secret-please-change-this-is-a-long-hs256-key-0123456789abcdef}
    expiration-seconds: ${JWT_EXPIRATION_SECONDS:3600}
    issuer: periferiait-auth

# Swagger UI accesible en /docs (springdoc genera el spec desde los controllers)
springdoc:
  swagger-ui:
    path: /docs

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

logging:
  level:
    com.fjuanias.periferiait: INFO
