services:
  postgres:
    image: postgres:16-alpine
    container_name: periferia-postgres
    environment:
      POSTGRES_DB: teli_dev
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: post1842
    ports:
      - "5432:5432"
    volumes:
      # El script se ejecuta SOLO en la primera inicialización (volumen vacío):
      # crea schemas, tablas, procedures y datos seed.
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d teli_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

  auth-service:
    build: ./periferiait-auth-service
    container_name: periferia-auth
    environment:
      SERVER_PORT: 8081
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: teli_dev
      DB_USER: postgres
      DB_PASSWORD: post1842
      # Debe ser IDÉNTICA en auth y logic para firmar/validar el mismo JWT.
      JWT_SECRET: ${JWT_SECRET:-dev-secret-please-change-this-is-a-long-hs256-key-0123456789abcdef}
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy

  logic-service:
    build: ./periferiait-logic-service
    container_name: periferia-logic
    environment:
      SERVER_PORT: 8082
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: teli_dev
      DB_USER: postgres
      DB_PASSWORD: post1842
      JWT_SECRET: ${JWT_SECRET:-dev-secret-please-change-this-is-a-long-hs256-key-0123456789abcdef}
      CORS_ALLOWED_ORIGINS: http://localhost:4200,http://localhost
    ports:
      - "8082:8082"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: ./periferiait-teli
    container_name: periferia-frontend
    environment:
      PORT: 4200
    ports:
      - "4200:4200"
    depends_on:
      - auth-service
      - logic-service

volumes:
  pgdata:
